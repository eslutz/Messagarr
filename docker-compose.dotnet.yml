version: '3.8'

services:
  messagarr:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
    container_name: messagarr
    restart: unless-stopped
    ports:
      - "4545:4545"
    volumes:
      - ./config:/config
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DataDirectory=/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
