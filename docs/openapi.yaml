openapi: 3.0.3
info:
  title: Messagarr API
  description: |
    Messagarr is a lightweight notification aggregation service that routes messages
    to multiple channels (Email, Discord, Slack, Teams) based on priority.
  version: 1.0.0
  contact:
    name: Messagarr Support
    url: https://github.com/eslutz/Messagarr
  license:
    name: MIT
    url: https://github.com/eslutz/Messagarr/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://messagarr:8080
    description: Docker container

tags:
  - name: notifications
    description: Notification operations
  - name: health
    description: Health and monitoring endpoints

paths:
  /notify:
    post:
      tags:
        - notifications
      summary: Send a notification
      description: |
        Send a notification to one or more channels. Notifications can be routed
        by priority groups or to specific channels. Duplicates are suppressed
        within a configurable time window.
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
            examples:
              simple:
                summary: Simple notification
                value:
                  title: "Test Notification"
                  body: "This is a test message"
                  priority: "normal"
              
              detailed:
                summary: Detailed notification with metadata
                value:
                  title: "Deployment Complete"
                  body: "Application v1.2.3 deployed to production"
                  priority: "high"
                  service: "deployment-service"
                  event_type: "deploy.success"
                  metadata:
                    version: "1.2.3"
                    environment: "production"
                    duration: "5m30s"
              
              explicit_channels:
                summary: Send to specific channels
                value:
                  title: "Custom Notification"
                  body: "This goes to specific channels only"
                  channels:
                    - "discord-alerts"
                    - "slack-ops"
      
      responses:
        '200':
          description: Notification sent successfully to all channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
              example:
                success: true
                message: "Notification sent"
                results:
                  discord-alerts:
                    success: true
                  email:
                    success: true
                duration: "245ms"
        
        '207':
          description: Notification partially sent (some channels failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
              example:
                success: false
                message: "Notification partially failed"
                results:
                  discord-alerts:
                    success: true
                  email:
                    success: false
                    error: "failed to connect to SMTP server"
                duration: "1.2s"
        
        '400':
          description: Invalid request (missing required fields or no channels available)
          content:
            text/plain:
              schema:
                type: string
              examples:
                missing_content:
                  value: "Title or body is required"
                no_channels:
                  value: "No channels available for notification"
        
        '405':
          description: Method not allowed (only POST is supported)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"
  
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: |
        Returns the health status of the service. Used by load balancers
        and orchestrators for liveness probes.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                timestamp: "2025-12-30T01:00:00Z"
                version: "1.0.0"
  
  /ready:
    get:
      tags:
        - health
      summary: Readiness check
      description: |
        Returns the readiness status of the service. Used by orchestrators
        to determine if the service is ready to accept traffic.
      operationId: getReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                ready: true
                timestamp: "2025-12-30T01:00:00Z"
                checks:
                  - name: "config"
                    status: "ok"
                  - name: "channels"
                    status: "ok"
  
  /metrics:
    get:
      tags:
        - health
      summary: Get Prometheus metrics
      description: |
        Returns Prometheus-formatted metrics for monitoring. Includes request rates,
        notification statistics, duration histograms, and uptime.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP messagarr_notifications_total Total number of notifications sent.
                # TYPE messagarr_notifications_total counter
                messagarr_notifications_total 1234
                # HELP messagarr_notifications_failed_total Total number of failed notifications.
                # TYPE messagarr_notifications_failed_total counter
                messagarr_notifications_failed_total 5
  
  /status:
    get:
      tags:
        - health
      summary: Get JSON status
      description: |
        Returns basic metrics in JSON format (legacy endpoint).
        Use /metrics for Prometheus monitoring.
      operationId: getStatus
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                total_notifications: 1234
                failed_notifications: 5
                channel_stats:
                  discord-alerts: 800
                  email: 400
                  slack-ops: 34
                uptime: "24h30m15s"

components:
  schemas:
    NotificationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Notification title/subject
          example: "Deployment Complete"
        
        body:
          type: string
          description: Notification body/message
          example: "Application v1.2.3 has been deployed successfully"
        
        priority:
          type: string
          description: Priority level (determines which channels receive the notification)
          enum:
            - high
            - normal
            - low
          default: normal
          example: "high"
        
        service:
          type: string
          description: Name of the service sending the notification
          example: "deployment-service"
        
        event_type:
          type: string
          description: Type of event triggering the notification
          example: "deploy.success"
        
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional key-value metadata
          example:
            version: "1.2.3"
            environment: "production"
        
        channels:
          type: array
          items:
            type: string
          description: |
            Explicit list of channels to send to. If provided, overrides
            priority-based routing.
          example:
            - "discord-alerts"
            - "email"
    
    NotificationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True if all channels succeeded
        
        message:
          type: string
          description: Summary message
          example: "Notification sent"
        
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChannelResult'
          description: Results per channel
        
        duration:
          type: string
          description: Total time taken to process the notification
          example: "245ms"
    
    ChannelResult:
      type: object
      properties:
        success:
          type: boolean
          description: True if this channel succeeded
        
        error:
          type: string
          description: Error message if failed
          example: "failed to connect to SMTP server"
    
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Health status
          enum:
            - ok
          example: "ok"
        
        timestamp:
          type: string
          format: date-time
          description: Current server time
          example: "2025-12-30T01:00:00Z"
        
        version:
          type: string
          description: Application version
          example: "1.0.0"
    
    ReadyResponse:
      type: object
      properties:
        ready:
          type: boolean
          description: True if service is ready
        
        timestamp:
          type: string
          format: date-time
          description: Current server time
          example: "2025-12-30T01:00:00Z"
        
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
          description: Individual readiness checks
    
    Check:
      type: object
      properties:
        name:
          type: string
          description: Name of the check
          example: "config"
        
        status:
          type: string
          description: Status of the check
          enum:
            - ok
            - error
          example: "ok"
        
        message:
          type: string
          description: Additional message (usually for errors)
          example: "Configuration loaded successfully"
    
    MetricsResponse:
      type: object
      properties:
        total_notifications:
          type: integer
          format: int64
          description: Total number of notifications sent
          example: 1234
        
        failed_notifications:
          type: integer
          format: int64
          description: Total number of failed notifications
          example: 5
        
        channel_stats:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Number of successful notifications per channel
          example:
            discord-alerts: 800
            email: 400
        
        uptime:
          type: string
          description: Service uptime
          example: "24h30m15s"
